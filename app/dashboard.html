<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phinmaed Learning</title>
    <link rel="icon" type="image/png" href="../assets/images/app-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&family=Inter:wght@700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#00461B">
    <link rel="apple-touch-icon" href="../assets/images/pwa-icon-192.png">
    <link rel="stylesheet" href="../css/style.css?v=20260624">
    <style>
        /* ── Boot loader — white background, ring spinner around the logo ── */
        #app-loading {
            position: fixed;
            inset: 0;
            background: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            z-index: 9999;
            transition: opacity .4s ease, visibility .4s ease;
        }
        #app-loading.fade-out { opacity: 0; visibility: hidden; pointer-events: none; }
        .al-ring {
            position: relative;
            width: 84px; height: 84px;
            display: flex; align-items: center; justify-content: center;
        }
        .al-ring::before {
            content: '';
            position: absolute; inset: 0;
            border-radius: 50%;
            border: 4px solid #E8F5EC;
        }
        .al-ring::after {
            content: '';
            position: absolute; inset: 0;
            border-radius: 50%;
            border: 4px solid transparent;
            border-top-color: #00461B;
            border-right-color: #00461B;
            animation: al-spin .9s linear infinite;
        }
        .al-logo {
            width: 56px; height: 56px;
            border-radius: 50%;
            object-fit: cover;
            position: relative;
        }
        @keyframes al-spin { to { transform: rotate(360deg); } }
        .al-label {
            color: #9CA3AF;
            font-size: 11px;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            font-family: sans-serif;
        }

        /* ── Page-transition spinner — small, floating, non-blocking ── */
        .page-spinner {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 60vh;
            gap: 20px;
            animation: ps-in .2s ease;
        }
        .page-spinner-text {
            font-size: 11px;
            color: #9ca3af;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-family: sans-serif;
        }
        @keyframes ps-in { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }

        .spinner {
            width: 1em; height: 1em; font-size: 36px;
            border-radius: 50%;
            border: .1em solid #E8F5EC;
            border-top-color: #00461B;
            animation: spinner-rotate .8s linear infinite;
        }
        @keyframes spinner-rotate { to { transform: rotate(360deg); } }

        /* Floating nav spinner — shown top-right during page navigation while
           the previous page's content stays visible underneath */
        #nav-spinner {
            position: fixed; top: 18px; right: 24px; z-index: 2000;
            width: 26px; height: 26px; border-radius: 50%;
            border: 3px solid #E8F5EC; border-top-color: #00461B;
            animation: spinner-rotate .8s linear infinite;
            display: none; box-shadow: 0 2px 8px rgba(0,0,0,.12);
            background: #fff;
        }
        #nav-spinner.show { display: block; }
    </style>
</head>
<body>
    <!-- Boot loader (full-screen while JS initialises) -->
    <div id="app-loading">
        <div class="al-ring">
            <img src="../assets/images/app-icon.png" alt="" class="al-logo">
        </div>
        <p class="al-label">Loading</p>
    </div>
    <!-- Floating spinner shown during in-app navigation; page stays visible underneath -->
    <div id="nav-spinner"></div>

    <!-- App shell (hidden until JS ready) -->
    <div id="app" class="app-container" style="display:none;">
        <aside class="sidebar" id="sidebar"></aside>
        <main class="main-content">
            <header class="topbar" id="topbar"></header>
            <div class="page-content" id="page-content"></div>
        </main>
    </div>

    <script type="module" src="./js/app.js?v=202606241500"></script>
    <script>
        /* PWA — this is the actual SPA shell users spend their session in
           (lessons, my subjects, chat, gradebook), so offline caching must
           be active here, not just on the marketing home page. */
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('../sw.js', { scope: '../' })
                    .then(reg => {
                        function showUpdateBar(worker) {
                            const bar = document.getElementById('pwa-update-bar');
                            if (bar) bar.style.display = 'flex';
                            document.getElementById('pwa-update-btn')?.addEventListener('click', () => {
                                worker.postMessage({ type: 'SKIP_WAITING' });
                            });
                        }
                        if (reg.waiting) showUpdateBar(reg.waiting);
                        reg.addEventListener('updatefound', () => {
                            const nw = reg.installing;
                            nw.addEventListener('statechange', () => {
                                if (nw.state === 'installed' && navigator.serviceWorker.controller) showUpdateBar(nw);
                            });
                        });
                    }).catch(() => {});
                navigator.serviceWorker.addEventListener('controllerchange', () => window.location.reload());
            });
        }
    </script>
</body>
</html>
