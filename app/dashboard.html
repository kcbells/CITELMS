<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COC-LMS</title>
    <link rel="icon" type="image/png" href="../assets/images/phinma_logo2.png">
    <link rel="stylesheet" href="../css/style.css?v=20260624">
    <style>
        /* ── Boot loader ── */
        #app-loading {
            position: fixed;
            inset: 0;
            background: #0f2e1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            z-index: 9999;
            transition: opacity .45s ease, visibility .45s ease;
        }
        #app-loading.fade-out { opacity: 0; visibility: hidden; pointer-events: none; }
        .al-logo {
            width: 72px; height: 72px;
            border-radius: 50%;
            background: rgba(255,255,255,.08);
            padding: 10px;
            animation: al-pulse 2s ease-in-out infinite;
        }
        .al-label {
            color: rgba(255,255,255,.4);
            font-size: 11px;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            font-family: sans-serif;
        }
        @keyframes al-pulse {
            0%,100% { transform:scale(1); opacity:1; }
            50%      { transform:scale(1.06); opacity:.8; }
        }

        /* ── Page-transition spinner ── */
        .page-spinner {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 60vh;
            gap: 20px;
            animation: ps-in .2s ease;
        }
        .page-spinner-text {
            font-size: 11px;
            color: #9ca3af;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-family: sans-serif;
        }
        @keyframes ps-in { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }

        /* ── Blade spinner — UIverse by mrhyddenn ── */
        .spinner {
            font-size: 36px;
            position: relative;
            display: inline-block;
            width: 1em;
            height: 1em;
        }
        .spinner .spinner-blade {
            position: absolute;
            left: 0.4629em;
            bottom: 0;
            width: 0.074em;
            height: 0.2777em;
            border-radius: 0.0555em;
            background-color: transparent;
            transform-origin: center -0.2222em;
            animation: spinner-fade 1s infinite linear;
        }
        .spinner .spinner-blade:nth-child(1)  { animation-delay: 0s;     transform: rotate(0deg); }
        .spinner .spinner-blade:nth-child(2)  { animation-delay: 0.083s; transform: rotate(30deg); }
        .spinner .spinner-blade:nth-child(3)  { animation-delay: 0.166s; transform: rotate(60deg); }
        .spinner .spinner-blade:nth-child(4)  { animation-delay: 0.249s; transform: rotate(90deg); }
        .spinner .spinner-blade:nth-child(5)  { animation-delay: 0.332s; transform: rotate(120deg); }
        .spinner .spinner-blade:nth-child(6)  { animation-delay: 0.415s; transform: rotate(150deg); }
        .spinner .spinner-blade:nth-child(7)  { animation-delay: 0.498s; transform: rotate(180deg); }
        .spinner .spinner-blade:nth-child(8)  { animation-delay: 0.581s; transform: rotate(210deg); }
        .spinner .spinner-blade:nth-child(9)  { animation-delay: 0.664s; transform: rotate(240deg); }
        .spinner .spinner-blade:nth-child(10) { animation-delay: 0.747s; transform: rotate(270deg); }
        .spinner .spinner-blade:nth-child(11) { animation-delay: 0.83s;  transform: rotate(300deg); }
        .spinner .spinner-blade:nth-child(12) { animation-delay: 0.913s; transform: rotate(330deg); }

        /* Boot loader blades — gold on dark green */
        #app-loading .spinner-blade {
            animation-name: spinner-fade-light;
        }
        @keyframes spinner-fade-light {
            0%   { background-color: #C8941A; }
            100% { background-color: transparent; }
        }

        /* Page spinner blades — green on white content */
        .page-spinner .spinner-blade {
            animation-name: spinner-fade-dark;
        }
        @keyframes spinner-fade-dark {
            0%   { background-color: #1a5c36; }
            100% { background-color: transparent; }
        }
    </style>
</head>
<body>
    <!-- Boot loader (full-screen while JS initialises) -->
    <div id="app-loading">
        <img src="../assets/images/phinma_logo2.png" alt="" class="al-logo">
        <div class="spinner">
            <div class="spinner-blade"></div>
            <div class="spinner-blade"></div>
            <div class="spinner-blade"></div>
            <div class="spinner-blade"></div>
            <div class="spinner-blade"></div>
            <div class="spinner-blade"></div>
            <div class="spinner-blade"></div>
            <div class="spinner-blade"></div>
            <div class="spinner-blade"></div>
            <div class="spinner-blade"></div>
            <div class="spinner-blade"></div>
            <div class="spinner-blade"></div>
        </div>
        <p class="al-label">Loading</p>
    </div>

    <!-- App shell (hidden until JS ready) -->
    <div id="app" class="app-container" style="display:none;">
        <aside class="sidebar" id="sidebar"></aside>
        <main class="main-content">
            <header class="topbar" id="topbar"></header>
            <div class="page-content" id="page-content"></div>
        </main>
    </div>

    <script type="module" src="./js/app.js?v=202606241500"></script>
</body>
</html>
